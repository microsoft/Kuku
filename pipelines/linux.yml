steps:
# The Microsoft-hosted agent's preinstalled vcpkg clone is whatever was current
# when the agent image was built; our manifest's builtin-baseline may be a
# newer commit that the agent doesn't have yet. Fetch first so vcpkg can
# resolve the baseline regardless of how new it is.
- script: |
    git -C "$(VCPKG_INSTALLATION_ROOT)" fetch --quiet origin
  displayName: 'Update vcpkg refs'

- script: |
    set -e
    if ! command -v ninja >/dev/null 2>&1; then
      sudo apt-get update && sudo apt-get install -y ninja-build
    fi
    ninja --version
  displayName: 'Ensure Ninja is available'

# CI drives the build through CMakePresets.json instead of repeating the option list here.
# That leaves one definition of how Kuku is built rather than two that can drift apart, and
# it means the presets are exercised on every run instead of rotting untested - before this,
# no pipeline invoked a preset at all.
#
# Warnings-as-errors is passed on the command line rather than baked into the preset. A
# developer using the same preset should not have their build broken by a new diagnostic
# from a newer toolchain; CI runs against known-green toolchains and should fail on one.
#
# The presets resolve the vcpkg toolchain through VCPKG_ROOT, which Microsoft-hosted agents
# publish as VCPKG_INSTALLATION_ROOT, so it is mapped here rather than duplicating the
# toolchain path into the preset file.
- script: |
    set -e
    cmake --preset linux-${{ parameters.presetSuffix }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
  displayName: 'Configure Kuku (preset)'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)

- script: |
    set -e
    cmake --build --preset linux-${{ parameters.presetSuffix }}
  displayName: 'Build Kuku'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)

- script: |
    set -e
    ctest --preset linux-${{ parameters.presetSuffix }}
  displayName: 'Run unit tests (ctest)'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)
