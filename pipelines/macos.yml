steps:
# The Microsoft-hosted agent's preinstalled vcpkg clone is whatever was current
# when the agent image was built; our manifest's builtin-baseline may be a
# newer commit that the agent doesn't have yet. Fetch first so vcpkg can
# resolve the baseline regardless of how new it is.
- script: |
    git -C "$(VCPKG_INSTALLATION_ROOT)" fetch --quiet origin
  displayName: 'Update vcpkg refs'

- script: |
    set -e
    if ! command -v ninja >/dev/null 2>&1; then
      brew install ninja
    fi
    ninja --version
  displayName: 'Ensure Ninja is available'

# Build arm64 for compile coverage, then x86_64 with the tests. Microsoft-hosted
# macos-latest runners may be Intel; x86_64 binaries run natively there and via Rosetta on
# an arm64 runner, so only the x86_64 leg runs the suite.
#
# Driven through CMakePresets.json like the other platforms; the macos-* presets already
# carry the same architectures and vcpkg triplets this leg used to pass by hand.
#
# NOTE: CMAKE_COMPILE_WARNING_AS_ERROR is deliberately NOT set here, unlike the Linux and
# Windows legs. Kuku's warning set was measured warning-clean on GCC and MSVC, but no Clang
# or AppleClang build has ever been observed, and -Werror should follow a measurement rather
# than an assumption - Clang's -Wconversion does not diagnose exactly the same constructs as
# GCC's. Add it to both configure steps below once one AppleClang run has been seen green.
- script: |
    set -e
    cmake --preset macos-arm64-${{ parameters.presetSuffix }}
    cmake --build --preset macos-arm64-${{ parameters.presetSuffix }}
  displayName: 'Build Kuku (arm64, compile coverage)'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)

- script: |
    set -e
    cmake --preset macos-x64-${{ parameters.presetSuffix }}
    cmake --build --preset macos-x64-${{ parameters.presetSuffix }}
  displayName: 'Build Kuku (x86_64)'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)

- script: |
    set -e
    ctest --preset macos-x64-${{ parameters.presetSuffix }}
  displayName: 'Run unit tests (ctest)'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)
