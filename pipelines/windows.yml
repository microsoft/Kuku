steps:
# The Microsoft-hosted agent's preinstalled vcpkg clone is whatever was current
# when the agent image was built; our manifest's builtin-baseline may be a
# newer commit that the agent doesn't have yet. Fetch first so vcpkg can
# resolve the baseline regardless of how new it is.
- script: |
    git -C "$(VCPKG_INSTALLATION_ROOT)" fetch --quiet origin
  displayName: 'Update vcpkg refs'

# Driven through CMakePresets.json, like the other platforms, so there is a single
# definition of how Kuku is built. Note that this also means CI now builds with the
# x64-windows-static-md triplet that the preset specifies; the hand-written invocation this
# replaced used the default triplet, so CI was validating a configuration that no developer
# following the README would actually get.
#
# The Visual Studio generator is multi-configuration, so the configuration is selected by
# the build and test presets rather than at configure time. See linux.yml for why
# warnings-as-errors is passed here rather than being baked into the preset.
- script: |
    cmake --preset win-vs2022-x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
  displayName: 'Configure Kuku (preset)'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)

- script: |
    cmake --build --preset win-vs2022-x64-${{ parameters.presetSuffix }}
  displayName: 'Build Kuku'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)

- script: |
    ctest --preset win-vs2022-x64-${{ parameters.presetSuffix }}
  displayName: 'Run unit tests (ctest)'
  env:
    VCPKG_ROOT: $(VCPKG_INSTALLATION_ROOT)
