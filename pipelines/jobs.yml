# This file selects the correct job definition for the requested platform and build configuration.
#
# Each platform template drives the build through CMakePresets.json, so what is passed down
# is the preset suffix rather than a CMake build type. It is spelled out here rather than
# derived from the configuration name so that the mapping is explicit and greppable.

parameters:
  debug: 'false'

jobs:

- ${{ if eq(parameters.name, 'Windows') }}:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.name }}
    pool:
      vmImage: 'windows-latest'
    steps:
    - template: windows.yml
      parameters:
        ${{ if eq(parameters.debug, 'true') }}:
          presetSuffix: 'debug'
        ${{ if eq(parameters.debug, 'false') }}:
          presetSuffix: 'release'

- ${{ if eq(parameters.name, 'Linux') }}:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.name }}
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: linux.yml
      parameters:
        ${{ if eq(parameters.debug, 'true') }}:
          presetSuffix: 'debug'
        ${{ if eq(parameters.debug, 'false') }}:
          presetSuffix: 'release'

- ${{ if eq(parameters.name, 'macOS') }}:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.name }}
    pool:
      vmImage: 'macos-latest'
    steps:
    - template: macos.yml
      parameters:
        ${{ if eq(parameters.debug, 'true') }}:
          presetSuffix: 'debug'
        ${{ if eq(parameters.debug, 'false') }}:
          presetSuffix: 'release'
